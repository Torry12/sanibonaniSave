# ?????????????????????????????????????????????????????????????????????????????
# SanibonaniSave ? Gradle Properties
# Android Studio Panda (2024.2.1)
# ?????????????????????????????????????????????????????????????????????????????

# JVM heap ? tuned for better performance in heavy compilation tasks like KSP/Hilt.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:HeapBaseMinAddress=6g -Dfile.encoding=UTF-8

# Pin Gradle JDK to Android Studio's bundled JBR (JDK 21) to avoid
# incompatibilities with newer JDKs (e.g. JDK 25 breaks Kotlin build-script parsing).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Parallel project execution
org.gradle.parallel=false
org.gradle.workers.max=2

# Gradle build cache
org.gradle.caching=true

# Configuration cache ? enables faster builds on consecutive runs
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Suppress Kotlin daemon warnings
kotlin.daemon.jvm.options=-Xmx1024m

# Enable R8 full mode in release
android.enableR8.fullMode=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false

# R8 Code Shrinking & Resource Optimization
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true

# Legacy flags (false = use modern defaults)
android.builtInKotlin=false
android.newDsl=false

# KSP 2.0 configuration ? ensure KSP2 is enabled and allow incremental processing for faster compilation
# NOTE: KSP1 is no longer available; enable KSP2 explicitly.
ksp.useKSP2=true
ksp.incremental=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
