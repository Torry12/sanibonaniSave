# ─────────────────────────────────────────────────────────────────────────────
# SanibonaniSave — Gradle Properties
# ─────────────────────────────────────────────────────────────────────────────

# JVM heap — tuned for heavy compilation tasks like KSP/Hilt.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:HeapBaseMinAddress=6g -Dfile.encoding=UTF-8

# NOTE: do NOT set org.gradle.java.home here. It was pinned to this machine's
# "C:/Program Files/Android/Android Studio1/jbr", which breaks every other
# contributor and all CI. The project targets JDK 17, which Gradle resolves via
# the foojay toolchain plugin declared in settings.gradle.kts.

# Parallel project execution
org.gradle.parallel=true
org.gradle.workers.max=4

# Gradle build cache
org.gradle.caching=true

# Configuration cache — enables faster builds on consecutive runs
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Deprecated-but-load-bearing flags: these emit warnings and change build
# behaviour if removed, so they stay until an explicit migration lands.
android.enableR8.fullMode=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true

# Suppress Kotlin daemon warnings
kotlin.daemon.jvm.options=-Xmx1024m

# R8 Code Shrinking & Resource Optimization
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true

# KSP 2 — KSP1 is no longer available, so KSP2 is the only remaining mode.
# Incremental processing is off: it is not reliable with the Hilt/KSP2
# combination used in :app and :data and can produce stale generated code.
ksp.useKSP2=true
ksp.incremental=false

# Enabled parallel sync
org.gradle.tooling.parallel=true

# Legacy escape hatches — AGP 9 ships built-in Kotlin support, which REJECTS an
# explicit `org.jetbrains.kotlin.android` plugin. All four modules still apply it,
# so these keep the build working until that migration is done.
# TODO: drop the explicit plugin from every build.gradle.kts, then remove these.
android.builtInKotlin=false
android.newDsl=false
