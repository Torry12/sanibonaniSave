name: SanibonaniSave CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: Lint
  # ─────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"               >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"     >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties
          echo "YOCO_PUBLIC_KEY=${{ secrets.YOCO_PUBLIC_KEY }}"         >> local.properties
          echo "GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}"       >> local.properties
          echo "WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}"           >> local.properties
          echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # Job 2: Unit Tests
  # ─────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"               >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"     >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties
          echo "YOCO_PUBLIC_KEY=${{ secrets.YOCO_PUBLIC_KEY }}"         >> local.properties
          echo "GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}"       >> local.properties
          echo "WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}"           >> local.properties
          echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # Job 3: Build Debug APK
  # ─────────────────────────────────────────────────────
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"               >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"     >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties
          echo "YOCO_PUBLIC_KEY=${{ secrets.YOCO_PUBLIC_KEY }}"         >> local.properties
          echo "GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}"       >> local.properties
          echo "WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}"           >> local.properties
          echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # Job 4: Deploy to Firebase App Distribution
  #         (only on push to main; requires secrets)
  # ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.FIREBASE_DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: apk/

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: apk/app-debug.apk
          releaseNotes: "Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"
