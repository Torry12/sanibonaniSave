name: "Copilot Setup Steps"

# Run whenever this file changes (for validation) or on demand.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job name MUST be `copilot-setup-steps` — Copilot ignores any other name.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # needed for actions/checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 Temurin matches gradle/gradle-daemon-jvm.properties (toolchainVendor=adoptium)
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle   # restores & saves ~/.gradle/caches and ~/.gradle/wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # A real local.properties is required for Gradle to configure the project
      # (build.gradle.kts reads several keys via buildConfigField). Placeholder
      # values are fine here — we only need the configuration phase to succeed
      # so that AGP and other Google Maven artifacts get downloaded into the cache.
      - name: Create mock local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
          echo "SUPABASE_URL=https://placeholder.supabase.co"        >> local.properties
          echo "SUPABASE_ANON_KEY=placeholder_anon_key"              >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=placeholder_service_key"   >> local.properties
          echo "YOCO_PUBLIC_KEY=placeholder_yoco_key"                >> local.properties
          echo "GEOAPIFY_API_KEY=placeholder_geo_key"                >> local.properties
          echo "WHATSAPP_TOKEN=placeholder_token"                    >> local.properties
          echo "WHATSAPP_PHONE_NUMBER_ID=placeholder_phone_id"       >> local.properties

      # `./gradlew help` triggers the Gradle configuration phase which resolves
      # and downloads AGP (from dl.google.com / maven.google.com) plus all other
      # build-script plugins into ~/.gradle/caches before Copilot's firewall starts.
      - name: Pre-download Gradle wrapper & build plugins (AGP etc.)
        run: ./gradlew help --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # Download all compile-time and runtime project dependencies so that
      # subsequent Copilot build/test invocations are fully offline-capable.
      - name: Pre-download project dependencies
        run: ./gradlew dependencies --no-daemon || true
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
